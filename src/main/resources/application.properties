spring.application.name=practice

spring.datasource.url=jdbc:mysql://localhost:3306/springbootdb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.data.web.pageable.max-page-size=100
spring.profiles.active=dev
spring.jpa.open-in-view=false

spring.data.web.pageable.serialization-mode=via-dto

# load lazy lists (like order items) in groups of 20 instead of one query each
spring.jpa.properties.hibernate.default_batch_fetch_size=20
